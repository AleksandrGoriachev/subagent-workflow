        "command": "node -e \"import('./plugin/lib/index.js').then(m=>{if(typeof m.guardStatusOf!=='function')throw new Error('guardStatusOf не экспортирован');const a=m.guardStatusOf({policy:'fail',registration:{guard:false,guardError:'cannot get property tools without inject',preExecute:true}});if(a.cause!=='inject-missing'||a.registered!==false)throw new Error('причина '+a.cause);const b=m.guardStatusOf({policy:'off',registration:{guard:false,guardError:null,preExecute:false}});if(b.cause!=='policy-off')throw new Error('off '+b.cause);const c=m.guardStatusOf({policy:'fail',registration:{guard:true,guardError:null,preExecute:true}});if(c.cause!=='registered'||c.registered!==true)throw new Error('registered '+c.cause);process.stdout.write('GUARD-STATUS OK')}).catch(e=>{console.error(e.message);process.exit(1)})\"",
