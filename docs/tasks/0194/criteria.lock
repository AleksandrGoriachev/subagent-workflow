        "id": "C1",
        "command": "node -e \"import('./plugin/lib/wait-guard.js').then(m=>{const os=require('node:os'),path=require('node:path');const ROOT=path.join(os.tmpdir(),'wf-inject-red');let got=null,handler=null;const ctx={on(){},get tools(){throw new Error('cannot get property tools without inject')},inject(deps,cb){got={deps,cb}}};const r=m.registerWaitGuard(ctx,{roots:[ROOT]});if(!got||!got.deps.includes('tools'))throw new Error('inject не запрошен');got.cb({tools:{guard(fn){handler=fn}}});if(r.registration.guard!==true)throw new Error('guard не зарегистрирован');if(typeof handler!=='function')throw new Error('guard-обработчик не получен');process.stdout.write('GUARD-INJECT OK')}).catch(e=>{console.error(e.message);process.exit(1)})\"",
