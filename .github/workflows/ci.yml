name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: версия во всех файлах
        run: node tools/check-version.mjs
      - name: selftest
        run: node spec/selftest.mjs
      - name: схема записи приёмки
        run: node spec/checks/acceptance-schema.mjs
      - name: acceptance-record — запись приёмки принадлежит заданию (0030)
        run: node spec/checks/acceptance-record.mjs
      - name: acceptance-p0 — повторная приёмка и preflight (0011)
        run: node spec/checks/acceptance-p0.mjs
      - name: actor-sources — источники актора (0008)
        run: node spec/checks/actor-sources.mjs
      - name: e2e
        run: node spec/e2e.mjs
      - name: contract-selfcheck — самопроверка контракта (0027)
        run: node spec/checks/contract-selfcheck.mjs
      - name: deployed-copy — проверки вне пакета и lint принятого (0013)
        run: node spec/checks/deployed-copy.mjs
      - name: режим хуков в индексе
        run: node spec/checks/hooks-mode.mjs
      - name: guard-acceptance — приёмочные кейсы guard (все)
        run: node spec/checks/guard-acceptance.mjs --all
      - name: panel-deploy — развёртывание движка из панели (0015)
        run: node spec/checks/panel-deploy.mjs
      - name: engine-root — внешний движок для воркспейса без спеки (0034)
        run: node spec/checks/engine-root.mjs
      - name: update-flow — обновление движка из панели (0026)
        run: node spec/checks/update-flow.mjs
      - name: deploy-safety — ключ проекта и POST-маршруты (0018)
        run: node spec/checks/deploy-safety.mjs
      - name: gate-rules — правила ворот не сломаны
        run: node spec/checks/gate-rules.mjs
      - name: pipe-free c1 — инструменты пакета без пайпов (0059)
        run: node spec/checks/pipe-free.mjs c1
      - name: gate-diagnostics c1 — диагностика ворот (0064)
        run: node spec/checks/gate-diagnostics.mjs c1
      - name: gate-diagnostics c2 — диагностика ворот (0064)
        run: node spec/checks/gate-diagnostics.mjs c2
      - name: gate-diagnostics c3 — диагностика ворот (0064)
        run: node spec/checks/gate-diagnostics.mjs c3
      - name: gate-diagnostics c4 — диагностика ворот (0064)
        run: node spec/checks/gate-diagnostics.mjs c4
      - name: gate-diagnostics c5 — диагностика ворот (0064)
        run: node spec/checks/gate-diagnostics.mjs c5
      - name: doctor-legacy-key c1 — legacy-ключ проекта (0064)
        run: node spec/checks/doctor-legacy-key.mjs c1
      - name: orchestration-doc c1 — инструкция внешнему оркестратору (0065)
        run: node spec/checks/orchestration-doc.mjs c1

  plugin:
    name: plugin / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: plugin tests
        run: node plugin/tools/test.mjs
      - name: client bundle syntax
        run: node --check plugin/lib/client.js

  deploy:
    name: deploy / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: e2e-deploy — init из развёрнутого каталога
        run: node spec/e2e-deploy.mjs
