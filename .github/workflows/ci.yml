name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: версия во всех файлах
        run: node tools/check-version.mjs
      - name: selftest
        run: node spec/selftest.mjs
      - name: e2e
        run: node spec/e2e.mjs
      - name: режим хуков в индексе
        run: node spec/checks/hooks-mode.mjs
      - name: guard-acceptance — приёмочные кейсы guard (все)
        run: node spec/checks/guard-acceptance.mjs --all

  plugin:
    name: plugin / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: plugin tests
        run: node plugin/tools/test.mjs
      - name: client bundle syntax
        run: node --check plugin/lib/client.js

  deploy:
    name: deploy / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: e2e-deploy — init из развёрнутого каталога
        run: node spec/e2e-deploy.mjs
